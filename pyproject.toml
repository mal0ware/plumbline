[project]
name = "plumbline"
version = "0.1.0"
description = "When a prediction market says 70%, does it happen 70% of the time?"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas.*", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
